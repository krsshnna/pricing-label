<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
        background-color: #e6e6e6;
      }
      .pricing-container{
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 200px;
        justify-content: center;
        
      }
      .pricing-plan:hover{
        transform: translateY(-8px);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      }
      
      .pricing-plan{
        background-color: #f2f2f2;
        display: flex;
        flex-direction: column;
        margin-top: 30px;
        justify-content: center;
        align-items: center;
        height: 300px;
        width: 400px;
        min-width: 250px;
        border-radius: 20px
        
      }
      .plan-title{
        font-size: 16px;
        font-weight: 600;
      }
      .plan-price{
        font-size: 32px;
        font-weight: 700;

      }
      .month{
        font-size: 16px;
        font-weight: 500;
      }
      .plan-features{
        font-size: 14px;
        font-weight: 400;
      }
      .plan-button{
        font-size: 14px;
        font-weight: 600;
        background-color: #2563EB;
        color: white;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 24px;
        padding-right: 24px;
        border: none;
        border-radius: 4px;
        transition: 0.2s;
        cursor: pointer;

      }
      .plan-button:hover{
        background-color: #1E40AF;
        transform: translateY(-4px);
        
        
      }
      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container{
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99<span class="month">/month</span></div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99<span class="month">/month</span></div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99<span class="month">/month</span></div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
